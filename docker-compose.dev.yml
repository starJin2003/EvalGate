name: evalgate-dev

# Local dev stack. Credentials below are dev-only defaults; override them in .env.
# Nothing here is used in CI beyond the pgvector smoke check, and nothing here ships to OCI.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: evalgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalgate}
      POSTGRES_DB: ${POSTGRES_DB:-evalgate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-evalgate} -d ${POSTGRES_DB:-evalgate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
