[tool.uv.workspace]
members = ["apps/*", "packages/*", "training"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "training"]

[tool.ruff.lint]
# TID was dropped in P1.1: TID252 bans parent-relative imports, which are the
# idiomatic way for a package to reference its own siblings.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["evalcore", "evalgate_api", "evalgate_sdk", "evalgate_training"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "training"]
# Members each carry their own tests/ dir, so basenames collide across the workspace
# (three test_smoke.py). importlib mode drops the sys.path/unique-basename requirement.
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
