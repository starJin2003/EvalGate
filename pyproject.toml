[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.isort]
known-first-party = ["evalcore", "evalgate_api", "evalgate_sdk"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
# Members each carry their own tests/ dir, so basenames collide across the workspace
# (three test_smoke.py). importlib mode drops the sys.path/unique-basename requirement.
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
