default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests routinely put several objects in one file
        # separated by `---`, and the default check-yaml calls that a parse
        # error. Two committed manifests are legitimately multi-document:
        # infra/k8s/airflow/20-evalgate-pod-rbac.yaml (Role + RoleBinding) and
        # infra/k8s/model/25-results-pv.yaml (PersistentVolume + Claim).
        # Splitting them to satisfy the hook would separate objects that are
        # only correct together.
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # P1.1 artifacts are intentionally committed and exceed 1 MB: the chunk
        # manifest is 2.6 MB and the generated dataset is larger. The 1 MB guard
        # still applies everywhere else.
        exclude: ^training/artifacts/.*\.(jsonl|json)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
