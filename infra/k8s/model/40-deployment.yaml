apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalgate-model
  namespace: evalgate
  labels:
    app.kubernetes.io/name: evalgate-model
    app.kubernetes.io/part-of: evalgate
spec:
  # One. The weights are 1,056 MiB of mmap and the node has 4 OCPU total; a
  # second replica would double the KV cache and halve the threads available to
  # each, for a service whose only consumer is a serial daily DAG.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evalgate-model
  strategy:
    # Recreate, not RollingUpdate. The default would start a second llama-server
    # before terminating the first, and two of them briefly overlap at 1500m of
    # CPU requests each against a node with ~2,490m unreserved - the new pod
    # would sit Pending on insufficient CPU while the old one waits to die.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evalgate-model
        app.kubernetes.io/part-of: evalgate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # Re-verify the weights on EVERY pod start, not just at upload time.
        #
        # upload-weights.sh already checked the digest once, but that ran on one
        # day against one disk. This catches bit rot, a truncated re-upload, a
        # half-finished manual copy, and the case where someone swaps in a
        # different GGUF and forgets. A corrupt-but-loadable 1 GB file is the
        # specific failure worth this container: llama-server would start, pass
        # every probe below, and serve confidently wrong answers that the eval
        # harness would score as a model regression.
        #
        # A mismatch is Init:CrashLoopBackOff, which names the problem. The
        # alternative - discovering it as a category score drop three weeks into
        # P3 - does not.
        - name: verify-gguf
          image: evalgate-llama-server:b10210
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              f="/models/${GGUF_FILENAME}"
              echo "verifying ${f}"
              if [ ! -f "$f" ]; then
                echo "FATAL: ${f} is missing. Run infra/k8s/model/upload-weights.sh." >&2
                exit 1
              fi
              actual_size=$(stat -c %s "$f")
              if [ "$actual_size" != "${GGUF_SIZE_BYTES}" ]; then
                echo "FATAL: size ${actual_size} != expected ${GGUF_SIZE_BYTES}" >&2
                exit 1
              fi
              echo "${GGUF_SHA256}  $f" | sha256sum -c - \
                || { echo "FATAL: sha256 mismatch. Refusing to serve these weights." >&2; exit 1; }
              echo "weights verified: ${GGUF_SHA256}"
          envFrom:
            # Generated by apply.sh from training/artifacts/p13/gguf_manifest.json.
            # Not committed and not hardcoded here: a second copy of a digest is
            # a second thing to forget to update, and the manifest is the
            # artifact that records which checkpoint these weights are.
            - configMapRef:
                name: evalgate-model-manifest
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: models
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: llama-server
          image: evalgate-llama-server:b10210
          # No registry on this cluster. The tag is explicit and never `latest`,
          # which would implicitly force imagePullPolicy: Always and send
          # kubelet to Docker Hub for an image that exists only in containerd.
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models/$(GGUF_FILENAME)
            - --alias
            - evalgate-qwen3-1.7b-v1-iter2000-Q4_K_M
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # 8192 is the P1.3 decision, unchanged. The suite's longest rendered
            # prompt is ~7.1k tokens, and a prompt above the window must return
            # HTTP 400 exceed_context_size_error rather than a silent
            # truncation - that 400 is what evalcore's ContextOverflowError is
            # built on, and a truncated prompt would produce a confident wrong
            # answer that scores as a genuine one.
            - --ctx-size
            - "8192"
            # One slot. The consumer is a serial daily DAG, and n_parallel > 1
            # would divide the context window per slot.
            - --parallel
            - "1"
            # THE load-bearing flag on this node. See LLAMA_THREADS below.
            - --threads
            - $(LLAMA_THREADS)
            - --threads-batch
            - $(LLAMA_THREADS)
            # Prometheus metrics for prefill/generation tok/s and prompt sizes,
            # scraped by 60-servicemonitor.yaml onto the existing Grafana stack.
            - --metrics
          env:
            # ---------------------------------------------------------------
            # Thread count: set explicitly because the default is wrong here.
            #
            # llama.cpp defaults -t to std::thread::hardware_concurrency(),
            # which reads the HOST's core count - Kubernetes does not
            # virtualize /proc/cpuinfo - so inside this pod the default is 4,
            # regardless of the CPU limit below.
            #
            # Against a 2500m limit the cgroup grants 250ms of CPU per 100ms
            # period. Four compute threads demand 400ms. The quota is exhausted
            # after ~62ms and EVERY thread in the pod is frozen for the
            # remaining ~38ms of each period, including the HTTP thread that
            # answers /health. That is worse than a 62% duty cycle, because
            # ggml's inter-op barrier is a spin: threads still runnable burn
            # quota spinning while waiting for throttled ones. It is also
            # exactly how the liveness probe starts flapping under load and
            # restarts the server mid-suite, which P3's DAG would surface as a
            # model failure rather than a sizing one.
            #
            # 3, chosen by measurement under this exact cgroup against a rule
            # committed before the numbers existed. Measured medians per case:
            #
            #   -t 3     79.3s   prefill 36.91 tok/s   throttled 90.6%  (37.8s)
            #   -t 4     79.4s   prefill 37.29 tok/s   throttled 94.7%  (121.0s)
            #   auto(4)  81.2s   prefill 37.29 tok/s   throttled 93.1%  (111.1s)
            #   -t 2     97.5s   prefill 30.49 tok/s   throttled  0.0%  ( 0.0s)
            #
            # The top three are within 5%, so the rule's tie-break took the
            # lowest thread count.
            #
            # The result is worth reading carefully, because the obvious
            # inference from the throttling story is wrong: -t 2 never throttles
            # and is still the SLOWEST arm by 23%. Avoiding the quota entirely
            # costs more prefill throughput than throttling does, so "don't
            # exceed the quota" is not the rule - prefill is compute-bound and
            # genuinely wants more threads than the quota can fund.
            #
            # What separates 3 from 4 is not median wall time, which is a tie,
            # but throttled TIME: 37.8s against 121.0s for the same work. 3
            # threads get throttled about as often and for a third as long, so
            # the pod spends far less time frozen with an unanswerable /health -
            # which is exactly what the liveness probe and the co-tenant API
            # care about, and is not visible in the wall-time column at all.
            #
            # Thread count does not change output: ggml partitions matmul by
            # output row, so no reduction is split across threads. That is what
            # made this sweep safe to run before the score comparison.
            - name: LLAMA_THREADS
              value: "3"
            # Same value again. With GGML_OPENMP=ON there are two knobs, and a
            # -t that OpenMP quietly overrides is the kind of thing that looks
            # like it was set.
            - name: OMP_NUM_THREADS
              value: "3"
            - name: GGUF_FILENAME
              valueFrom:
                configMapKeyRef:
                  name: evalgate-model-manifest
                  key: GGUF_FILENAME
          ports:
            - name: http
              containerPort: 8080
          # -------------------------------------------------------------------
          # Probes. Every one is httpGet /health and NONE is tcpSocket.
          #
          # MEASURED on this build rather than assumed, because the assumption
          # was wrong. b10210 does NOT bind its listening socket before loading
          # the model: polling a restarting pod every 250ms gives connection
          # refused for ~24s and then 200 {"status":"ok"} on the first
          # successful connect. There is no 503 "loading model" window here at
          # all, so on THIS build a tcpSocket probe would not in fact go ready
          # early - the risk that motivated this design does not exist in this
          # version.
          #
          # httpGet /health stays anyway, for two reasons that survive the
          # correction:
          #   - That ordering is an llama.cpp implementation detail, not a
          #     contract. The 503 loading path exists in the server's code for
          #     configurations that do bind early, and bind-then-load is a
          #     plausible thing for an upgrade to reintroduce. A probe that is
          #     correct only because of the current startup order is a probe
          #     that silently stops being correct at the next bump.
          #   - tcpSocket and httpGet differ in a failure this node can actually
          #     produce: a wedged or CPU-starved HTTP thread holds the listening
          #     socket open while answering nothing. tcpSocket passes that;
          #     httpGet does not.
          #
          # So the startupProbe's real job is not waiting out a 503 window - it
          # is tolerating ~24s of connection-refused without the liveness probe
          # accumulating failures against a pod that is loading normally.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60   # 5 minutes to load 1,056 MiB from the boot volume
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            # 6 x 30s = 3 minutes of consecutive failures before a restart.
            # Deliberately forgiving: on a CPU-contended node a probe timeout is
            # far more likely to mean "the HTTP thread lost a scheduling race
            # during prefill" than "the server is wedged", and restarting a
            # healthy server mid-suite destroys a two-hour measurement.
            failureThreshold: 6
          resources:
            # The budget reserved during the Airflow block, unchanged.
            # Memory arithmetic:
            #   Q4_K_M weights (mmap)                        1,056 MiB
            #   KV cache f16 @ 8192 ctx
            #     28 layers x 8 KV heads x 128 dim x 2 x 2B
            #     = 112 KiB/token x 8192                       896 MiB
            #   compute buffer + logits + server            ~250-350 MiB
            #                                              ------------
            #                                                 ~2.2 GiB
            # MEASURED, and the arithmetic above was too optimistic. Under load
            # the cgroup reports memory.current 2,628 Mi and memory.peak
            # 2,900 Mi - against an original 3Gi limit that is 94.4%, and above
            # an original 2Gi request. The gap is mmap'd weight pages, which
            # count as page cache inside the container's own memory cgroup.
            #
            # Raised to 3Gi request / 4Gi limit rather than left tight. Page
            # cache is reclaimable so this was unlikely to OOM, but a cgroup
            # sitting at 94% of its limit reclaims continuously, and what it
            # reclaims here is the model itself - which then has to be re-read
            # from disk mid-inference. Memory is the resource this node has
            # spare (PROGRESS: CPU is the binding constraint, memory requests
            # sat at 16%), so buying headroom costs nothing that matters.
            #
            # mmap is left on and --mlock is NOT used: mlock needs IPC_LOCK and
            # this container drops ALL capabilities.
            requests:
              cpu: 1500m
              memory: 3Gi
            limits:
              cpu: 2500m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: models
              readOnly: true
            # readOnlyRootFilesystem is absolute; anything reaching for a temp
            # file otherwise gets EROFS.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: evalgate-models
            readOnly: true
        - name: tmp
          emptyDir: {}
