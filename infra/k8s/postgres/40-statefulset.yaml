apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: evalgate
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: evalgate
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: evalgate
    spec:
      # The volume is ReadWriteOnce on one node, so two Postgres pods could
      # never both mount it anyway. Ordered replacement makes that explicit
      # instead of leaving it to a scheduling race.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          # Same image as docker-compose.dev.yml. pgvector is not optional: P4
          # clusters failure traces with it, and adding the extension to an
          # already-initialised cluster is a migration, so it ships from day one.
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            # Created out-of-band; see infra/k8s/README.md. Deliberately not a
            # manifest in this directory — a password in the repo is a password
            # in every clone and every fork of a public repo, forever.
            - secretRef:
                name: postgres-credentials
          env:
            # A subdirectory of the mount, because the mount root is the PV root
            # and initdb requires an empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # The node has 24 GB and 4 OCPU. This leaves headroom for the
              # model server, kube-prometheus-stack, and Airflow, which all land
              # on this same node later in P2 and P3.
              cpu: "2"
              memory: 2Gi
          # initdb on first boot has to create the cluster and run the extension
          # SQL before anything answers. A startup probe gives that up to two
          # minutes without making the liveness probe permissive forever after.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 30
            timeoutSeconds: 5
            # Higher than readiness on purpose. A busy Postgres should be taken
            # out of service long before it is killed and restarted.
            failureThreshold: 6
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
        - name: init
          configMap:
            # Generated from infra/postgres/init/ by apply.sh so the dev stack
            # and the cluster cannot drift apart. Runs only on an empty data
            # directory, exactly like the compose stack.
            name: postgres-init
