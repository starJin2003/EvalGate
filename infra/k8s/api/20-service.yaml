apiVersion: v1
kind: Service
metadata:
  name: evalgate-api
  namespace: evalgate
  labels:
    app.kubernetes.io/name: evalgate-api
    app.kubernetes.io/part-of: evalgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: evalgate-api
  ports:
    - name: http
      port: 80
      targetPort: http
    # Scraped by the ServiceMonitor. Not referenced by the Ingress, so it has no
    # path from the internet.
    - name: metrics
      port: 9000
      targetPort: metrics
